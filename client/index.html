<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>NoteAssemble</title>
    <meta name="description" content="NoteAssemble turns your meeting transcripts and notes into structured summaries, decisions, and action items — powered by AI." />
    <meta name="application-name" content="NoteAssemble" />
    <meta name="theme-color" content="#0e0e0e" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NoteAssemble" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / iMessage / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NoteAssemble" />
    <meta property="og:title" content="NoteAssemble — AI Meeting Notes" />
    <meta property="og:description" content="Turn your meeting transcripts and notes into structured summaries, decisions, and action items — powered by AI." />
    <meta property="og:url" content="https://noteassemble.com" />
    <meta property="og:image" content="https://noteassemble.com/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NoteAssemble — AI Meeting Notes" />
    <meta name="twitter:description" content="Turn your meeting transcripts and notes into structured summaries, decisions, and action items — powered by AI." />
    <meta name="twitter:image" content="https://noteassemble.com/icons/icon-512.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NoteAssemble",
      "url": "https://noteassemble.com",
      "description": "NoteAssemble turns your meeting transcripts and notes into structured summaries, decisions, and action items — powered by AI.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",
          "description": "10 sessions per month, AI analysis, action items"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "12",
          "priceCurrency": "USD",
          "description": "Unlimited sessions, weekly digest, priority support"
        }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "12"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is NoteAssemble?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NoteAssemble is an AI-powered meeting notes tool that turns your transcripts and notes into structured summaries, decisions, and action items. It works with any meeting platform."
          }
        },
        {
          "@type": "Question",
          "name": "How does NoteAssemble work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Paste a transcript, upload notes, or connect your meeting tool. NoteAssemble's AI extracts key decisions, action items, owners, and deadlines automatically."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a free plan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The free plan includes 10 sessions per month with full AI analysis and action item tracking. No credit card required to start."
          }
        },
        {
          "@type": "Question",
          "name": "Does NoteAssemble work on mobile?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. NoteAssemble is a progressive web app (PWA) that can be installed on your iPhone or Android home screen and works offline."
          }
        },
        {
          "@type": "Question",
          "name": "Can I share meeting summaries with my team?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Every session can be shared via a read-only link. Recipients don't need a NoteAssemble account to view the summary."
          }
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>document.title = "NoteAssemble";</script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
